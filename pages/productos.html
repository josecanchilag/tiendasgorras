<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo completo de Urban Caps: más de 20 gorras urbanas, deportivas, snapback, trucker y premium con búsqueda, filtros y ofertas.">
    <meta name="keywords" content="catálogo gorras, comprar gorras, snapback, trucker, gorras urbanas">
    <meta name="author" content="Urban Caps">
    <title>Catálogo de gorras | Urban Caps</title>

    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <meta name="theme-color" content="#0B1F33">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Urban Caps">
    <meta property="og:title" content="Catálogo de gorras | Urban Caps">
    <meta property="og:description" content="Más de 20 gorras urbanas, deportivas, snapback, trucker y premium con buscador y filtros.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1653704841996-c2ed854aedd8?auto=format&fit=crop&w=1200&q=80">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="productos" data-base="../">
    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>

    <div id="navbar-container"></div>

    <main id="contenido">
        <section class="uc-page-hero">
            <div class="container">
                <h1 class="uc-page-title">Catálogo de gorras</h1>
                <p>Explora todos nuestros modelos y encuentra la gorra que combina contigo.</p>
            </div>
        </section>

        <section class="uc-section">
            <div class="container">
                <nav aria-label="Migas de pan" class="uc-breadcrumb">
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="../index.html">Inicio</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Catálogo</li>
                    </ol>
                </nav>

                <!-- ============================ FILTROS ============================ -->
                <div class="uc-filters" role="search" aria-label="Filtros del catálogo">
                    <div class="row g-3">
                        <div class="col-12 col-lg-4">
                            <label for="filtro-busqueda" class="form-label">Buscar producto</label>
                            <div class="uc-search-box">
                                <i class="bi bi-search"></i>
                                <input type="search" class="form-control" id="filtro-busqueda" placeholder="Ej: snapback navy…" autocomplete="off">
                            </div>
                        </div>
                        <div class="col-6 col-md-4 col-lg-2">
                            <label for="filtro-categoria" class="form-label">Categoría</label>
                            <select class="form-select" id="filtro-categoria">
                                <option value="">Todas</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-4 col-lg-2">
                            <label for="filtro-color" class="form-label">Color</label>
                            <select class="form-select" id="filtro-color">
                                <option value="">Todos</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-4 col-lg-2">
                            <label for="filtro-precio" class="form-label">Rango de precio</label>
                            <select class="form-select" id="filtro-precio">
                                <option value="">Todos</option>
                                <option value="0-70000">Menos de $70.000</option>
                                <option value="70000-90000">$70.000 – $90.000</option>
                                <option value="90000-130000">$90.000 – $130.000</option>
                                <option value="130000-999999">Más de $130.000</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-4 col-lg-2">
                            <label for="filtro-orden" class="form-label">Ordenar por</label>
                            <select class="form-select" id="filtro-orden">
                                <option value="relevancia">Relevancia</option>
                                <option value="precio-asc">Precio: menor a mayor</option>
                                <option value="precio-desc">Precio: mayor a menor</option>
                                <option value="nombre">Nombre (A – Z)</option>
                                <option value="popularidad">Popularidad</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 gap-2">
                        <p class="uc-results-count mb-0" id="resultados-contador">Cargando productos…</p>
                        <div class="d-flex align-items-center gap-2 flex-wrap" id="filtros-activos"></div>
                        <button type="button" class="btn btn-sm btn-outline-dark" id="btn-limpiar-filtros">
                            <i class="bi bi-x-circle me-1"></i> Limpiar filtros
                        </button>
                    </div>
                </div>

                <!-- ============================ RESULTADOS ============================ -->
                <div id="catalogo-grid" class="row g-4 mt-2" aria-live="polite"></div>

                <div id="catalogo-vacio" class="uc-empty text-center d-none">
                    <i class="bi bi-emoji-frown"></i>
                    <h2>No encontramos resultados</h2>
                    <p>Prueba con otra palabra clave o limpia los filtros para ver todo el catálogo.</p>
                    <button type="button" class="btn btn-primary" id="btn-limpiar-filtros-vacio">Ver todo el catálogo</button>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/data/productos.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/components/footer.js"></script>
    <script src="../js/components/productCard.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/pages/productos.js"></script>
</body>
</html>
